# Se ejecuta en cada push y pull request: pruebas del backend y revisión + compilación del sitio.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Sitio (lint y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Velora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Velora/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
